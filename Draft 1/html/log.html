<main>
  <section class="page-intro">
    <h2>Activity Log</h2>
    <p>
      Record your meals and workouts in one place to understand how your daily
      habits support your fitness goal.
    </p>
  </section>
  
  <section class="logger-layout">
    <section class="card">
      <h3>Nutrition Form</h3>

      <form>
        <div class="form-group">
          <label for="food-name">Food Name</label>
          <input type="text" id="food-name" name="food-name" placeholder="e.g., Chicken salad" />
        </div>

        <div class="form-group">
          <label for="food-quantity">Quantity</label>
          <input type="text" id="food-quantity" name="food-quantity" placeholder="e.g., 1 bowl" />
        </div>

        <div class="form-group">
          <label for="food-calories">Estimated Calories</label>
          <input type="number" id="food-calories" name="food-calories" placeholder="e.g., 450" />
        </div>

        <button type="submit">Add Food</button>
      </form>
    </section>
